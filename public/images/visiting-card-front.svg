<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <!-- Rich Multi-Stop Chocolate Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C0212" />
      <stop offset="45%" stop-color="#3E000C" />
      <stop offset="100%" stop-color="#210006" />
    </linearGradient>

    <!-- Metallic Gold Foil Gradient -->
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5E5" />
      <stop offset="25%" stop-color="#FFECD1" />
      <stop offset="50%" stop-color="#D9A866" />
      <stop offset="75%" stop-color="#FFF0D9" />
      <stop offset="100%" stop-color="#B8863D" />
    </linearGradient>

    <!-- Subtle Radial Glow in Center -->
    <radialGradient id="centerGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFECD1" stop-opacity="0.14" />
      <stop offset="60%" stop-color="#FFECD1" stop-opacity="0.04" />
      <stop offset="100%" stop-color="#FFECD1" stop-opacity="0" />
    </radialGradient>

    <filter id="goldDrop" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#000000" flood-opacity="0.5" />
    </filter>

    <style>
      .monogram { font-family: "Georgia", "Playfair Display", "Times New Roman", serif; font-size: 66px; font-weight: 700; fill: url(#goldFoil); letter-spacing: 7px; text-anchor: middle; filter: url(#goldDrop); }
      .brand-title { font-family: "Georgia", "Playfair Display", "Times New Roman", serif; font-size: 42px; font-weight: 700; fill: url(#goldFoil); letter-spacing: 5px; text-anchor: middle; text-transform: uppercase; filter: url(#goldDrop); }
      .brand-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12.5px; font-weight: 700; fill: #FFECD1; opacity: 0.95; letter-spacing: 5.5px; text-transform: uppercase; text-anchor: middle; }
      .brand-desc { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 11px; font-weight: 600; fill: #FFECD1; opacity: 0.8; letter-spacing: 3.5px; text-transform: uppercase; text-anchor: middle; }
      .tagline { font-family: "Georgia", serif; font-style: italic; font-size: 16px; fill: #FFECD1; opacity: 0.9; text-anchor: middle; }
      .border-line { fill: none; stroke: url(#goldFoil); stroke-width: 1.75; opacity: 0.75; }
      .border-inner { fill: none; stroke: #FFECD1; stroke-width: 0.75; opacity: 0.35; stroke-dasharray: 5, 3; }
      .corner-flourish { fill: url(#goldFoil); }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="500" fill="url(#bgGrad)" />

  <!-- Center Ambient Radiance -->
  <circle cx="450" cy="250" r="380" fill="url(#centerGlow)" />

  <!-- Dual Outer Frame -->
  <rect x="28" y="28" width="844" height="444" rx="8" class="border-line" />
  <rect x="40" y="40" width="820" height="420" rx="5" class="border-inner" />

  <!-- Ornate Corner Motifs -->
  <g class="corner-flourish">
    <!-- Top-Left -->
    <path d="M 40 40 L 46 34 L 52 40 L 46 46 Z" />
    <path d="M 40 40 L 40 68 M 40 40 L 68 40" stroke="url(#goldFoil)" stroke-width="1.5" fill="none" opacity="0.8" />
    <circle cx="68" cy="40" r="2" />
    <circle cx="40" cy="68" r="2" />

    <!-- Top-Right -->
    <path d="M 860 40 L 854 34 L 848 40 L 854 46 Z" />
    <path d="M 860 40 L 860 68 M 860 40 L 832 40" stroke="url(#goldFoil)" stroke-width="1.5" fill="none" opacity="0.8" />
    <circle cx="832" cy="40" r="2" />
    <circle cx="860" cy="68" r="2" />

    <!-- Bottom-Left -->
    <path d="M 40 460 L 46 454 L 52 460 L 46 466 Z" />
    <path d="M 40 460 L 40 432 M 40 460 L 68 460" stroke="url(#goldFoil)" stroke-width="1.5" fill="none" opacity="0.8" />
    <circle cx="68" cy="460" r="2" />
    <circle cx="40" cy="432" r="2" />

    <!-- Bottom-Right -->
    <path d="M 860 460 L 854 454 L 848 460 L 854 466 Z" />
    <path d="M 860 460 L 860 432 M 860 460 L 832 460" stroke="url(#goldFoil)" stroke-width="1.5" fill="none" opacity="0.8" />
    <circle cx="832" cy="460" r="2" />
    <circle cx="860" cy="432" r="2" />
  </g>

  <!-- Central Monogram Medallion -->
  <g transform="translate(450, 162)">
    <!-- Guilloche radiating ticks -->
    <circle cx="0" cy="0" r="64" fill="none" stroke="url(#goldFoil)" stroke-width="0.8" opacity="0.3" stroke-dasharray="2, 4" />
    <circle cx="0" cy="0" r="56" fill="none" stroke="url(#goldFoil)" stroke-width="2" opacity="0.85" />
    <circle cx="0" cy="0" r="49" fill="#250007" stroke="url(#goldFoil)" stroke-width="0.75" opacity="0.95" />

    <!-- Crown Star Accent -->
    <path d="M 0 -38 L 4 -29 L 13 -29 L 6 -23 L 9 -14 L 0 -20 L -9 -14 L -6 -23 L -13 -29 L -4 -29 Z" fill="url(#goldFoil)" opacity="0.9" transform="scale(0.6)" />

    <!-- Monogram Letters -->
    <text x="0" y="23" class="monogram">GUS</text>
  </g>

  <!-- Brand Typography -->
  <text x="450" y="286" class="brand-title">Glow Unisex Salon</text>
  
  <!-- Separator Bar with Diamond Center -->
  <g transform="translate(450, 310)">
    <line x1="-140" y1="0" x2="-24" y2="0" stroke="url(#goldFoil)" stroke-width="1.2" opacity="0.7" />
    <polygon points="0,-5 6,0 0,5 -6,0" fill="url(#goldFoil)" />
    <circle cx="-14" cy="0" r="1.75" fill="url(#goldFoil)" opacity="0.85" />
    <circle cx="14" cy="0" r="1.75" fill="url(#goldFoil)" opacity="0.85" />
    <line x1="24" y1="0" x2="140" y2="0" stroke="url(#goldFoil)" stroke-width="1.2" opacity="0.7" />
  </g>

  <text x="450" y="342" class="brand-sub">HAUTE COIFFURE &bull; BALAYAGE &bull; BRIDAL ARTISTRY</text>
  <text x="450" y="375" class="tagline">&ldquo;Where Craft Meets Care&rdquo;</text>
  <text x="450" y="418" class="brand-desc">FLAGSHIP ATELIER &bull; Rajouri Garden, New Delhi</text>
</svg>
