<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 500" width="900" height="500">
  <defs>
    <!-- Sand & Cream Gradient -->
    <linearGradient id="sandBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF9" />
      <stop offset="50%" stop-color="#FFF4E6" />
      <stop offset="100%" stop-color="#FFECD1" />
    </linearGradient>

    <style>
      .brand-title-back { font-family: "Georgia", "Playfair Display", serif; font-size: 27px; font-weight: 700; fill: #3E000C; letter-spacing: 2.8px; text-transform: uppercase; }
      .brand-sub-back { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 10px; font-weight: 700; fill: #3E000C; opacity: 0.8; letter-spacing: 3.2px; text-transform: uppercase; }
      .field-label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 9.5px; font-weight: 700; fill: #3E000C; opacity: 0.58; letter-spacing: 2px; text-transform: uppercase; }
      .field-value { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 14.5px; font-weight: 600; fill: #3E000C; }
      .border-outer-back { fill: none; stroke: #3E000C; stroke-width: 1.5; opacity: 0.35; }
      .border-inner-back { fill: none; stroke: #3E000C; stroke-width: 0.75; opacity: 0.18; stroke-dasharray: 4, 3; }
      .qr-card-box { fill: #FFFFFF; stroke: #3E000C; stroke-width: 1.2; }
      .qr-pixel-dark { fill: #3E000C; }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="900" height="500" fill="url(#sandBg)" />

  <!-- Double Hairline Framing -->
  <rect x="28" y="28" width="844" height="444" rx="8" class="border-outer-back" />
  <rect x="38" y="38" width="824" height="424" rx="5" class="border-inner-back" />

  <!-- Left Column: Atelier Details -->
  <g transform="translate(68, 70)">
    <!-- Brand Header -->
    <text x="0" y="0" class="brand-title-back">Glow Unisex Salon</text>
    <text x="0" y="21" class="brand-sub-back">HAUTE COIFFURE &bull; BALAYAGE &bull; SENSORY DERMA</text>
    <line x1="0" y1="36" x2="470" y2="36" stroke="#3E000C" stroke-width="1.2" opacity="0.2" />

    <!-- 1. Direct Telephones -->
    <g transform="translate(0, 68)">
      <circle cx="8" cy="-3" r="14" fill="#3E000C" opacity="0.08" />
      <text x="0" y="-12" class="field-label">DIRECT TELEPHONE</text>
      <text x="0" y="8" class="field-value">+919876543210</text>

      <text x="245" y="-12" class="field-label">WHATSAPP CONCIERGE</text>
      <text x="245" y="8" class="field-value">+919876543210</text>
    </g>

    <!-- 2. Address & Locality -->
    <g transform="translate(0, 142)">
      <text x="0" y="-12" class="field-label">ATELIER LOCATION</text>
      <text x="0" y="8" class="field-value">Main Market, Block J, Rajouri Garden</text>
      <text x="0" y="28" class="field-value" font-size="13px" opacity="0.85">Rajouri Garden, New Delhi, Delhi 110027</text>
    </g>

    <!-- 3. Timings & Appointments -->
    <g transform="translate(0, 226)">
      <text x="0" y="-12" class="field-label">OPERATING SCHEDULE</text>
      <text x="0" y="8" class="field-value">10:00 AM – 8:30 PM (Open 7 Days a Week)</text>
    </g>

    <!-- 4. Digital Portfolio & Consultation Protocol -->
    <g transform="translate(0, 292)">
      <text x="0" y="-12" class="field-label">ONLINE PORTFOLIO</text>
      <text x="0" y="8" class="field-value" font-weight="700">glowsalon.in</text>
      <text x="245" y="-12" class="field-label">APPOINTMENT PROTOCOL</text>
      <text x="245" y="8" class="field-value" font-size="12px" opacity="0.85">Prior Reservation Recommended</text>
    </g>
  </g>

  <!-- Vertical Divider with Center Diamond -->
  <g transform="translate(590, 250)">
    <line x1="0" y1="-185" x2="0" y2="-15" stroke="#3E000C" stroke-width="1.2" opacity="0.2" />
    <polygon points="0,-8 5,0 0,8 -5,0" fill="#3E000C" opacity="0.45" />
    <line x1="0" y1="15" x2="0" y2="185" stroke="#3E000C" stroke-width="1.2" opacity="0.2" />
  </g>

  <!-- Right Column: Scan to Connect (High-Fidelity Stylized QR Card) -->
  <g transform="translate(635, 110)">
    <!-- QR Card Container -->
    <rect x="0" y="0" width="206" height="206" rx="16" class="qr-card-box" filter="drop-shadow(0 8px 16px rgba(62,0,12,0.08))" />

    <!-- Precision Corner Brackets -->
    <path d="M 14 26 L 14 14 L 26 14" fill="none" stroke="#3E000C" stroke-width="1.75" />
    <path d="M 192 26 L 192 14 L 180 14" fill="none" stroke="#3E000C" stroke-width="1.75" />
    <path d="M 14 180 L 14 192 L 26 192" fill="none" stroke="#3E000C" stroke-width="1.75" />
    <path d="M 192 180 L 192 192 L 180 192" fill="none" stroke="#3E000C" stroke-width="1.75" />

    <!-- Precision QR Elements -->
    <!-- Top-Left Finder -->
    <rect x="28" y="28" width="46" height="46" rx="4" class="qr-pixel-dark" />
    <rect x="35" y="35" width="32" height="32" rx="2" fill="#FFFFFF" />
    <rect x="42" y="42" width="18" height="18" rx="1" class="qr-pixel-dark" />

    <!-- Top-Right Finder -->
    <rect x="132" y="28" width="46" height="46" rx="4" class="qr-pixel-dark" />
    <rect x="139" y="35" width="32" height="32" rx="2" fill="#FFFFFF" />
    <rect x="146" y="42" width="18" height="18" rx="1" class="qr-pixel-dark" />

    <!-- Bottom-Left Finder -->
    <rect x="28" y="132" width="46" height="46" rx="4" class="qr-pixel-dark" />
    <rect x="35" y="139" width="32" height="32" rx="2" fill="#FFFFFF" />
    <rect x="42" y="146" width="18" height="18" rx="1" class="qr-pixel-dark" />

    <!-- Data Blocks & Timing Patterns -->
    <rect x="84" y="32" width="12" height="12" class="qr-pixel-dark" />
    <rect x="106" y="32" width="16" height="8" class="qr-pixel-dark" />
    <rect x="88" y="54" width="28" height="12" class="qr-pixel-dark" />
    <rect x="34" y="84" width="18" height="10" class="qr-pixel-dark" />
    <rect x="60" y="86" width="12" height="18" class="qr-pixel-dark" />
    <rect x="82" y="82" width="16" height="24" class="qr-pixel-dark" />
    <rect x="112" y="76" width="24" height="14" class="qr-pixel-dark" />
    <rect x="146" y="84" width="22" height="12" class="qr-pixel-dark" />
    <rect x="152" y="108" width="14" height="14" class="qr-pixel-dark" />

    <!-- Bottom Data Blocks -->
    <rect x="84" y="138" width="22" height="14" class="qr-pixel-dark" />
    <rect x="114" y="132" width="14" height="22" class="qr-pixel-dark" />
    <rect x="138" y="140" width="32" height="12" class="qr-pixel-dark" />
    <rect x="88" y="162" width="16" height="16" class="qr-pixel-dark" />
    <rect x="118" y="166" width="26" height="12" class="qr-pixel-dark" />
    <rect x="154" y="162" width="16" height="16" class="qr-pixel-dark" />

    <!-- Center Monogram Mini Badge -->
    <circle cx="103" cy="103" r="17" fill="#FFFFFF" stroke="#3E000C" stroke-width="1.4" />
    <text x="103" y="107" font-family="Georgia, serif" font-size="10.5px" font-weight="700" fill="#3E000C" text-anchor="middle">GUS</text>

    <!-- Scan Caption -->
    <text x="103" y="240" font-family="-apple-system, sans-serif" font-size="11.5px" font-weight="700" fill="#3E000C" letter-spacing="2.2px" text-anchor="middle">SCAN TO CHAT</text>
    <text x="103" y="258" font-family="-apple-system, sans-serif" font-size="9px" font-weight="500" fill="#3E000C" opacity="0.65" letter-spacing="1.2px" text-anchor="middle">INSTANT WHATSAPP RECEPTION</text>
  </g>
</svg>
